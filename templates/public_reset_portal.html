<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ reseller.panel_name or 'Reseller Panel' }} — Client HWID Reset Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(124, 58, 237, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.1), transparent 40%),
                  #070913;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .portal-card {
      width: 100%;
      max-width: 480px;
      background: rgba(18, 22, 37, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.15);
      color: var(--purple-light);
      border: 1px solid rgba(124, 58, 237, 0.3);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .portal-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .portal-sub {
      font-size: 13.5px;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status-box {
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
      font-size: 13.5px;
      line-height: 1.5;
      display: none;
    }
    .status-box.success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      display: block;
    }
    .status-box.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      display: block;
    }
  </style>
</head>
<body>

<div class="portal-card">
  <!-- Reseller Badge -->
  <div class="portal-badge">
    <span>👑</span> {{ reseller.panel_name or 'Authorized Reseller' }}
  </div>

  <div class="portal-title">Client HWID Reset Portal</div>
  <div class="portal-sub">
    Enter your client username below to clear your Hardware ID (HWID) lock. Once reset, you can immediately log into the application on your new PC.
  </div>

  <form id="reset-portal-form">
    <div class="form-group mb-16">
      <label class="form-label" style="font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;">Your App Username</label>
      <input class="form-control" id="portal-username" placeholder="Enter your username…" required autofocus autocomplete="off" style="font-size:15px;padding:12px 16px;border-radius:10px;"/>
    </div>

    <button type="submit" class="btn btn-primary btn-block btn-lg" id="portal-submit-btn" style="border-radius:10px;font-weight:700;">
      🔄 Reset Hardware ID (HWID)
    </button>
  </form>

  <div id="portal-result-box" class="status-box"></div>

  <div style="margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text3);">
    <span>Managed by <strong>{{ reseller.username }}</strong></span>
    <span>Secure HWID Authorization</span>
  </div>
</div>

<script>
document.getElementById('reset-portal-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('portal-submit-btn');
  const userInp = document.getElementById('portal-username');
  const username = userInp.value.trim();
  const resBox = document.getElementById('portal-result-box');

  if (!username) return;

  btn.disabled = true;
  btn.textContent = '⏳ Verifying & Resetting…';
  resBox.className = 'status-box';
  resBox.style.display = 'none';

  try {
    const res = await fetch('/portal/api/reset-hwid', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: '{{ token }}',
        username: username
      })
    });
    const data = await res.json();

    if (data.success) {
      resBox.className = 'status-box success';
      resBox.innerHTML = `
        <div style="font-weight:700;font-size:15px;margin-bottom:4px;">✅ HWID Reset Successful!</div>
        <div>${data.message}</div>
        <div style="margin-top:8px;font-size:12px;opacity:0.85;">You can now open the .exe application and log in on your new PC.</div>
      `;
      userInp.value = '';
    } else {
      resBox.className = 'status-box error';
      resBox.innerHTML = `
        <div style="font-weight:700;font-size:15px;margin-bottom:4px;">❌ Reset Failed</div>
        <div>${data.message}</div>
      `;
    }
  } catch(err) {
    resBox.className = 'status-box error';
    resBox.innerHTML = `<div style="font-weight:700;">❌ Network Error</div><div>Unable to connect to server. Please try again.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 Reset Hardware ID (HWID)';
  }
});
</script>
</body>
</html>
